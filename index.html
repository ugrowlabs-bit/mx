<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fb6b35" />
    <meta name="description" content="태국 바트, 원화, 달러를 한 화면에서 바로 비교하세요." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Baht Now — 바트·원화·달러 비교</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">THAILAND PRICE CHECK</p>
          <h1>Baht Now</h1>
          <p class="intro">가격 하나만 입력하면 세 통화가 함께 바뀝니다.</p>
        </div>
        <button class="install-button" id="installButton" type="button" hidden>홈 화면에 추가</button>
      </header>

      <section class="converter" aria-label="통화 변환기">
        <div id="currencyFields"></div>

        <div class="quick-values" aria-label="빠른 바트 금액">
          <button type="button" data-baht="100">฿100</button>
          <button type="button" data-baht="500">฿500</button>
          <button type="button" data-baht="1000">฿1,000</button>
          <button type="button" data-baht="5000">฿5,000</button>
        </div>
      </section>

      <section class="rate-card" aria-live="polite">
        <div class="status-line">
          <span class="status-dot" id="statusDot"></span>
          <span id="rateStatus">환율을 불러오는 중…</span>
        </div>
        <button class="refresh-button" id="refreshButton" type="button">지금 갱신</button>
      </section>

      <p class="notice">공개 기준 환율을 사용한 참고 금액입니다. 실제 카드 결제·현금 환전 금액에는 수수료와 환전 마진이 적용될 수 있습니다.</p>
    </main>

    <noscript>이 계산기를 사용하려면 JavaScript를 켜 주세요.</noscript>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
